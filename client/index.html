<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0082a8" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="Colonias de Verano - Sistema Digital de Inscripción y Fichas Médicas - Municipalidad de Valle Viejo" />

    <!-- La app instalable (PWA) es solo de uso interno: el manifest y las etiquetas de "app" se agregan
         únicamente fuera de las páginas públicas para familias (formulario de inscripción y ficha por link).
         Misma regla que client/src/pwa.js, que la mantiene al cambiar de página dentro de la app. -->
    <script>
      (function () {
        var base = '%BASE_URL%';
        var ruta = location.pathname.indexOf(base) === 0 ? '/' + location.pathname.slice(base.length) : location.pathname;
        if (/^\/(inscripcion|ficha)(\/|$)/.test(ruta)) return;
        var head = document.head;
        var link = document.createElement('link');
        link.rel = 'manifest';
        link.href = base + 'manifest.json';
        link.setAttribute('data-pwa', '');
        head.appendChild(link);
        [['apple-mobile-web-app-capable', 'yes'], ['mobile-web-app-capable', 'yes'], ['apple-mobile-web-app-title', 'Colonias VV']].forEach(function (m) {
          var meta = document.createElement('meta');
          meta.name = m[0];
          meta.content = m[1];
          meta.setAttribute('data-pwa', '');
          head.appendChild(meta);
        });
      })();
    </script>
    <link rel="icon" href="%BASE_URL%favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%BASE_URL%favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Figtree (títulos) + Atkinson Hyperlegible (texto, diseñada para máxima legibilidad) + Roboto (planilla impresa) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
    <!-- Material Symbols Rounded — iconos para @material/web Web Components -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet" />

    <title>Colonias de Verano • Municipalidad de Valle Viejo</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register("%BASE_URL%sw.js").catch(() => {});
        });
      }
    </script>
  </body>
</html>
